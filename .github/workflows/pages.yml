name: Deploy WWM site

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export public Kobo samples
        env:
          KOBO_BASE_URL: ${{ vars.KOBO_BASE_URL || 'https://eu.kobotoolbox.org' }}
          KOBO_ASSET_UID: ${{ vars.KOBO_ASSET_UID || 'a8Rvu5KasYeAfsa2GfFppG' }}
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: python scripts/export_kobo_static.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: wwm/frontend
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
